[package]
name = "agentdeck"
version = "0.2.0"
description = "A local chat UI for the user's Claude Code CLI"
authors = ["AgentDeck"]
edition = "2021"

[lib]
name = "agentdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process", "sync", "net", "time"] }
nix = { version = "0.29", features = ["signal", "process"] }
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service"] }
url = "2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
